<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA — Marine EcOsystem Reasoning with Collaborative Agents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --navy-deep:#0A1F2B;
            --navy-mid:#123A4A;
            --plotter-green:#1E8A72;
            --plotter-green-bright:#2FBE9C;
            --parchment:#F5EFE2;
            --parchment-dim:#EAE2CF;
            --coral:#E2673F;
            --sea-glass:#7FA6A8;
            --ink:#12262E;
        }
        *{box-sizing:border-box;}
        html,body{height:100%;margin:0;}
        body{
            font-family:'Inter',sans-serif;
            background:var(--navy-deep);
            color:var(--parchment);
            overflow:hidden;
        }

        .app{
            display:flex;
            flex-direction:column;
            height:100vh;
        }

        /* ---------- HEADER ---------- */
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:14px 22px;
            background:linear-gradient(180deg, var(--navy-mid), var(--navy-deep));
            border-bottom:1px solid rgba(127,166,168,0.25);
            flex-shrink:0;
        }
        .brand{
            display:flex;
            align-items:baseline;
            gap:10px;
        }
        .brand-mark{
            font-family:'Fraunces',serif;
            font-weight:700;
            font-size:1.6rem;
            letter-spacing:0.02em;
            color:var(--parchment);
        }
        .brand-sub{
            font-size:0.72rem;
            color:var(--sea-glass);
            font-weight:500;
            letter-spacing:0.01em;
        }
        .coords-readout{
            font-family:'Inter',monospace;
            font-size:0.72rem;
            color:var(--plotter-green-bright);
            letter-spacing:0.03em;
            margin-left:24px;
            opacity:0.85;
        }
        .header-right{
            display:flex;
            align-items:center;
            gap:14px;
        }
        .toggle-label{
            font-size:0.85rem;
            color:var(--sea-glass);
            font-weight:500;
        }
        .toggle{
            position:relative;
            width:46px;
            height:26px;
            border-radius:14px;
            background:rgba(127,166,168,0.25);
            cursor:pointer;
            border:1px solid rgba(127,166,168,0.4);
            transition:background 0.25s ease;
        }
        .toggle.on{
            background:var(--plotter-green);
            border-color:var(--plotter-green-bright);
        }
        .toggle-knob{
            position:absolute;
            top:2px;
            left:2px;
            width:20px;
            height:20px;
            border-radius:50%;
            background:var(--parchment);
            transition:left 0.25s ease;
        }
        .toggle.on .toggle-knob{ left:22px; }

        /* ---------- MAIN SPLIT ---------- */
        .main{
            flex:1;
            display:flex;
            min-height:0;
            position:relative;
        }

        .chat-panel{
            display:flex;
            flex-direction:column;
            background:var(--parchment);
            color:var(--ink);
            width:100%;
            transition:width 0.35s cubic-bezier(.4,0,.2,1);
            min-width:0;
        }
        .main.map-open .chat-panel{
            width:48%;
        }

        .map-panel{
            width:0%;
            overflow:hidden;
            background:var(--navy-mid);
            transition:width 0.35s cubic-bezier(.4,0,.2,1);
            position:relative;
            border-left:1px solid rgba(127,166,168,0.25);
        }
        .main.map-open .map-panel{
            width:52%;
        }
        #map{
            height:100%;
            width:100%;
            filter: saturate(0.9);
        }
        .map-caption{
            position:absolute;
            top:14px;
            left:14px;
            z-index:500;
            background:rgba(10,31,43,0.85);
            color:var(--parchment);
            padding:8px 14px;
            border-radius:4px;
            font-size:0.75rem;
            font-family:monospace;
            letter-spacing:0.02em;
            border:1px solid rgba(127,166,168,0.3);
            pointer-events:none;
        }

        /* ---------- CHAT LOG ---------- */
        .log{
            flex:1;
            overflow-y:auto;
            padding:26px 26px 10px 26px;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .msg{
            max-width:78%;
            line-height:1.5;
            font-size:0.95rem;
        }
        .msg.user{
            align-self:flex-end;
            background:var(--navy-deep);
            color:var(--parchment);
            padding:11px 16px;
            border-radius:14px 14px 3px 14px;
        }
        .msg.bot{
            align-self:flex-start;
            display:flex;
            gap:11px;
        }
        .bot-avatar{
            flex-shrink:0;
            width:30px;
            height:30px;
            border-radius:50%;
            background:var(--plotter-green);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'Fraunces',serif;
            font-weight:600;
            font-size:0.85rem;
            color:var(--parchment);
            margin-top:2px;
        }
        .bot-bubble{
            background:var(--parchment-dim);
            padding:11px 16px;
            border-radius:3px 14px 14px 14px;
            border:1px solid rgba(18,38,46,0.08);
        }
        .bot-bubble .tag{
            display:inline-block;
            font-family:monospace;
            font-size:0.65rem;
            letter-spacing:0.04em;
            color:var(--plotter-green);
            background:rgba(30,138,114,0.12);
            padding:2px 7px;
            border-radius:3px;
            margin-bottom:6px;
        }
        .bot-bubble .tag.warn{
            color:var(--coral);
            background:rgba(226,103,63,0.14);
        }
        .timestamp{
            font-size:0.68rem;
            color:#8a8272;
            margin-top:5px;
        }

        /* ---------- INPUT BAR ---------- */
        .input-bar{
            display:flex;
            align-items:center;
            gap:10px;
            padding:16px 22px;
            background:var(--parchment-dim);
            border-top:1px solid rgba(18,38,46,0.1);
            flex-shrink:0;
        }
        .input-bar input{
            flex:1;
            border:1px solid rgba(18,38,46,0.15);
            background:var(--parchment);
            color:var(--ink);
            padding:12px 16px;
            border-radius:22px;
            font-size:0.92rem;
            font-family:inherit;
            outline:none;
        }
        .input-bar input:focus{
            border-color:var(--plotter-green);
        }
        .icon-btn{
            width:42px;
            height:42px;
            border-radius:50%;
            border:none;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            flex-shrink:0;
            transition:transform 0.15s ease, background 0.15s ease;
        }
        .icon-btn:active{ transform:scale(0.92); }
        .mic-btn{
            background:var(--navy-mid);
            color:var(--parchment);
        }
        .mic-btn.listening{
            background:var(--coral);
            animation:pulse 1.2s infinite;
        }
        @keyframes pulse{
            0%{ box-shadow:0 0 0 0 rgba(226,103,63,0.55); }
            70%{ box-shadow:0 0 0 10px rgba(226,103,63,0); }
            100%{ box-shadow:0 0 0 0 rgba(226,103,63,0); }
        }
        .send-btn{
            background:var(--plotter-green);
            color:var(--parchment);
        }
        .send-btn:hover{ background:var(--plotter-green-bright); }

        .listening-hint{
            text-align:center;
            font-size:0.72rem;
            color:var(--coral);
            padding-bottom:4px;
            height:14px;
        }

        /* scrollbar */
        .log::-webkit-scrollbar{ width:6px; }
        .log::-webkit-scrollbar-thumb{ background:rgba(18,38,46,0.18); border-radius:3px; }

        @media (max-width: 760px){
            .main.map-open .chat-panel{ width:0%; }
            .main.map-open .map-panel{ width:100%; }
            .coords-readout{ display:none; }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="brand">
            <span class="brand-mark">ORCA</span>
            <span class="brand-sub">Marine EcOsystem Reasoning with Collaborative Agents</span>
            <span class="coords-readout" id="coordsReadout">09.28°N · 79.31°E</span>
        </div>
        <div class="header-right">
            <span class="toggle-label">Chart view</span>
            <div class="toggle" id="mapToggle" onclick="toggleMap()">
                <div class="toggle-knob"></div>
            </div>
        </div>
    </header>

    <div class="main" id="mainSplit">
        <div class="chat-panel">
            <div class="log" id="log"></div>
            <div class="listening-hint" id="listeningHint"></div>
            <div class="input-bar">
                <button class="icon-btn mic-btn" id="micBtn" onclick="toggleListening()" title="Speak">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <input type="text" id="textInput" placeholder="Ask about weather, tides, or where to fish…" onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="icon-btn send-btn" onclick="sendMessage()" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
        <div class="map-panel">
            <div class="map-caption" id="mapCaption">TAMIL NADU · KERALA COAST — LIVE ADVISORY LAYER</div>
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
    // ---------------- MAP SETUP ----------------
    let map = null;
    let mapInitialized = false;

    function initMap(){
        if(mapInitialized) return;
        map = L.map('map', { zoomControl:true }).setView([9.9, 78.5], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 12
        }).addTo(map);

        // PFZ advisory points (sample)
        const pfzPoints = [
            { lat: 9.28, lon: 79.31, name: "Valiyapani reef", note: "PFZ · 12–17km offshore, SW" },
            { lat: 9.98, lon: 79.83, name: "Near Tuticorin", note: "PFZ advisory active" },
            { lat: 8.90, lon: 76.60, name: "Kollam coast", note: "PFZ · favourable SST" }
        ];
        pfzPoints.forEach(p => {
            const marker = L.circleMarker([p.lat, p.lon], {
                radius: 7, color:'#2FBE9C', fillColor:'#1E8A72', fillOpacity:0.9, weight:2
            }).addTo(map);
            marker.bindPopup(`<b>${p.name}</b><br>${p.note}`);
        });

        // Hazard zone (sample)
        L.circle([10.4, 79.9], {
            radius: 30000, color:'#E2673F', fillColor:'#E2673F', fillOpacity:0.15, weight:1.5, dashArray:'4,4'
        }).addTo(map).bindPopup("Rough sea advisory — wave height 2.1m");

        mapInitialized = true;
    }

    function toggleMap(){
        const toggle = document.getElementById('mapToggle');
        const main = document.getElementById('mainSplit');
        toggle.classList.toggle('on');
        main.classList.toggle('map-open');
        if(main.classList.contains('map-open')){
            setTimeout(() => {
                initMap();
                map && map.invalidateSize();
            }, 380);
        }
    }

    // ---------------- CHAT LOGIC ----------------
    const log = document.getElementById('log');
    const coordsReadout = document.getElementById('coordsReadout');

    function timeNow(){
        return new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    }

    function addUserMessage(text){
        const div = document.createElement('div');
        div.className = 'msg user';
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function addBotMessage(text, tag, warn){
        const wrap = document.createElement('div');
        wrap.className = 'msg bot';
        wrap.innerHTML = `
      <div class="bot-avatar">O</div>
      <div>
        <div class="bot-bubble">
          ${tag ? `<span class="tag${warn ? ' warn' : ''}">${tag}</span><br>` : ''}
          ${text}
        </div>
        <div class="timestamp">${timeNow()}</div>
      </div>
    `;
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
    }

    // Simple canned-response engine for demo purposes
    function generateResponse(userText){
        const t = userText.toLowerCase();

        if(t.includes('safe') || t.includes('venture') || t.includes('go out')){
            return { tag:'SAFETY ADVISORY', warn:false, text:
                    "Sea conditions off Tamil Nadu look moderate today — wave height around 1.6–2.0m, wind from the southwest at 25–35 kmph. Generally safe for larger boats; smaller craft should stay alert through the afternoon as wind picks up." };
        }
        if(t.includes('fish') || t.includes('pfz') || t.includes('where')){
            return { tag:'FISHING ZONE', warn:false, text:
                    "There's an active fishing zone advisory near Valiyapani reef, about 12–17km southwest of the coast. Water conditions there currently support good fish activity — toggle Chart View to see it on the map." };
        }
        if(t.includes('tide')){
            return { tag:'TIDE', warn:false, text:
                    "Tide near Tuticorin is currently low, around 0.3m, rising toward a high of 0.85m by early evening." };
        }
        if(t.includes('cyclone') || t.includes('storm') || t.includes('warning')){
            return { tag:'HAZARD ALERT', warn:true, text:
                    "No cyclone warning is active for your area right now. There is a rough-sea advisory near the Cauvery delta coast — wave heights above 2m. Worth checking Chart View before heading that direction." };
        }
        if(t.includes('wind')){
            return { tag:'WIND', warn:false, text:
                    "Wind is currently from the southwest at roughly 28 kmph near the coast, strengthening slightly toward evening." };
        }
        return { tag:null, warn:false, text:
                "I can help with sea safety, fishing zones, tides, weather, and hazard alerts for the coast. Try asking something like \"is it safe to go out tomorrow\" or \"where should I fish near Tuticorin.\"" };
    }

    function sendMessage(){
        const input = document.getElementById('textInput');
        const text = input.value.trim();
        if(!text) return;
        addUserMessage(text);
        input.value = '';

        setTimeout(() => {
            const r = generateResponse(text);
            addBotMessage(r.text, r.tag, r.warn);
        }, 550);
    }

    // Seed the conversation
    addBotMessage("Welcome aboard. Ask me about sea safety, tides, weather, or where to fish along the coast — in text or by voice.", null, false);

    // ---------------- VOICE INPUT ----------------
    let recognition = null;
    let listening = false;
    const micBtn = document.getElementById('micBtn');
    const listeningHint = document.getElementById('listeningHint');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SpeechRecognition){
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-IN';

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('textInput').value = transcript;
            sendMessage();
        };
        recognition.onend = () => {
            listening = false;
            micBtn.classList.remove('listening');
            listeningHint.textContent = '';
        };
        recognition.onerror = () => {
            listening = false;
            micBtn.classList.remove('listening');
            listeningHint.textContent = 'Could not hear that — try again';
            setTimeout(() => listeningHint.textContent = '', 2000);
        };
    }

    function toggleListening(){
        if(!recognition){
            listeningHint.textContent = 'Voice input not supported in this browser';
            setTimeout(() => listeningHint.textContent = '', 2500);
            return;
        }
        if(listening){
            recognition.stop();
        } else {
            listening = true;
            micBtn.classList.add('listening');
            listeningHint.textContent = 'Listening…';
            recognition.start();
        }
    }
</script>
</body>
</html>
