<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA — Marine EcOsystem Reasoning with Collaborative Agents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">
    <header>
        <div class="brand">
            <span class="brand-sub">GLAUCUS</span>
            <span class="coords-readout" id="coordsReadout">09.28°N · 79.31°E</span>
        </div>
        <div class="header-right">
            <span class="toggle-label">Chart view</span>
            <div class="toggle" id="mapToggle" onclick="toggleMap()">
                <div class="toggle-knob"></div>
            </div>
        </div>
    </header>

    <div class="main" id="mainSplit">
        <div class="chat-panel">
            <div class="log" id="log"></div>
            <div class="listening-hint" id="listeningHint"></div>
            <div class="input-bar">
                <div class="input-wrap">
                    <input type="text" id="textInput" placeholder="Ask about weather, tides, or where to fish…" onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="icon-btn mic-btn" id="micBtn" onclick="toggleListening()" title="Speak">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>
</div>
<div class="sa-overlay" id="systemAlertOverlay" role="alertdialog" aria-live="assertive" aria-hidden="true">
    <div class="sa-panel">
        <span class="sa-corner sa-corner-tl"></span>
        <span class="sa-corner sa-corner-tr"></span>
        <span class="sa-corner sa-corner-bl"></span>
        <span class="sa-corner sa-corner-br"></span>
        <div class="sa-scanline"></div>

        <div class="sa-header">
            <span class="sa-glyph">⚠</span>
            <span class="sa-title" id="systemAlertTitle">SYSTEM WARNING</span>
            <span class="sa-glyph">⚠</span>
        </div>
        <div class="sa-subtitle" id="systemAlertSubtitle">HAZARD DETECTED IN RANGE</div>

        <div class="sa-body" id="systemAlertBody"></div>

        <button class="sa-ack" id="systemAlertAck" onclick="dismissSystemAlert()">[ ACKNOWLEDGE ]</button>
    </div>
</div>

<!-- Persistent status chip — visible for the whole time a hazard is in range,
     independent of whether the popup above has been acknowledged. Now
     clickable: fires a fresh geofence check and re-opens the popup with
     updated distances. Its own visibility is unaffected — that's still
     driven entirely by renderGeofenceState()/showHazardBadge()/hideHazardBadge(). -->
<div class="sa-badge" id="hazardBadge" onclick="onHazardBadgeClick()" role="button" tabindex="0" aria-hidden="true">
    <span class="sa-badge-dot"></span>
    HAZARDS ACTIVE
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>

</body>
</html>
